name: Build and deploy Python app to Azure Web App - ecoalerta-backend-new

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - uses: actions/checkout@v4

      - name: Create deployment zip from backend folder
        run: |
          cd backend
          zip -r ../backend_deploy.zip . \
            --exclude "__pycache__/*" \
            --exclude "**/__pycache__/*" \
            --exclude "*.pyc" \
            --exclude ".venv/*" \
            --exclude "venv/*" \
            --exclude "antenv/*" \
            --exclude ".python_packages/*"

      - name: Deploy to Azure Web App
        uses: azure/webapps-deploy@v3
        with:
          app-name: 'ecoalerta-backend-new'
          slot-name: 'Production'
          publish-profile: ${{ secrets.AZURE_WEBAPP_PUBLISH_PROFILE }}
          package: backend_deploy.zip
