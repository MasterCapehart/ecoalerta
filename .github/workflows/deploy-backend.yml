name: Desplegar Backend a Azure

on:
  push:
    branches:
      - main
    paths:
      - 'backend/**'
      - '.github/workflows/deploy-backend.yml'
  workflow_dispatch:

env:
  AZURE_WEBAPP_NAME: ecoalerta-backend
  PYTHON_VERSION: '3.11'

jobs:
  quality-check:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgis/postgis:15-3.4
        env:
          POSTGRES_DB: ecoalerta_test
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d ecoalerta_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      DEBUG: 'True'
      DB_NAME: ecoalerta_test
      DB_USER: postgres
      DB_PASSWORD: postgres
      DB_HOST: 127.0.0.1
      DB_PORT: '5432'
      DB_SSLMODE: disable
      SECRET_KEY: test-secret-key
    steps:
    - name: Checkout código
      uses: actions/checkout@v4

    - name: Configurar Python
      uses: actions/setup-python@v5
      with:
        python-version: ${{ env.PYTHON_VERSION }}

    - name: Instalar dependencias del sistema para tests
      run: |
        sudo apt-get update
        sudo apt-get install -y libpq-dev postgresql-client

    - name: Esperar a PostgreSQL
      run: |
        for i in {1..15}; do
          pg_isready -h 127.0.0.1 -p 5432 -U postgres && exit 0
          sleep 2
        done
        echo "PostgreSQL no respondió a tiempo"
        exit 1

    - name: Instalar dependencias Python
      run: |
        cd backend
        python -m pip install --upgrade pip
        pip install -r requirements.txt

    - name: Lint backend
      run: |
        cd backend
        black --check .
        flake8 .

    - name: Ejecutar migraciones y tests backend
      run: |
        cd backend
        python manage.py migrate --noinput
        python manage.py test --verbosity 2

  build-and-deploy:
    runs-on: ubuntu-latest
    needs: quality-check
    
    steps:
    - name: Checkout código
      uses: actions/checkout@v4

    - name: Configurar Python
      uses: actions/setup-python@v5
      with:
        python-version: ${{ env.PYTHON_VERSION }}

    - name: Instalar dependencias del sistema
      run: |
        sudo apt-get update
        sudo apt-get install -y libpq-dev

    - name: Preparar archivos para despliegue
      run: |
        echo "=== Preparando archivos para despliegue ==="
        cd backend
        # Asegurar que los scripts tengan permisos de ejecución
        chmod +x startup.sh build.sh || true
        echo "=== Verificando estructura del directorio ==="
        ls -la | head -15
        cd ..
    
    - name: Crear ZIP para despliegue (con estructura correcta para Oryx)
      run: |
        echo "=== Creando ZIP para despliegue ==="
        cd backend
        # Verificar que los archivos críticos existen
        echo "=== Verificando archivos críticos ==="
        ls -la manage.py requirements.txt ecoalerta/settings.py ecoalerta/middleware.py || echo "⚠️ Algunos archivos no encontrados"
        # Crear ZIP incluyendo todo lo necesario para que Oryx construya
        zip -r ../backend-deploy.zip . \
          -x "*.git*" "*.pyc" "__pycache__/*" "*.log" "venv/*" ".venv/*" "antenv/*" "*.sqlite3" "*.db"
        cd ..
        echo "=== Verificando contenido del ZIP ==="
        unzip -l backend-deploy.zip | grep -E "(startup.sh|build.sh|requirements.txt|manage.py|middleware.py|settings.py)" | head -15
        ls -lh backend-deploy.zip
        echo "=== Verificando que middleware.py esté en el ZIP ==="
        unzip -l backend-deploy.zip | grep "middleware.py" || echo "⚠️ middleware.py no encontrado en ZIP"

    - name: Desplegar a Azure App Service
      uses: azure/webapps-deploy@v3
      with:
        app-name: ${{ env.AZURE_WEBAPP_NAME }}
        publish-profile: ${{ secrets.AZURE_WEBAPP_PUBLISH_PROFILE }}
        package: ./backend-deploy.zip

    - name: Reiniciar App Service
      uses: azure/CLI@v1
      with:
        inlineScript: |
          az webapp restart --name ${{ env.AZURE_WEBAPP_NAME }} --resource-group $(az webapp show --name ${{ env.AZURE_WEBAPP_NAME }} --query resourceGroup -o tsv) || echo "⚠️ No se pudo reiniciar automáticamente"
      continue-on-error: true

    - name: Verificar despliegue
      run: |
        echo "✅ Despliegue completado"
        echo ""
        echo "📝 IMPORTANTE: Si es la primera vez o el startup command no está configurado,"
        echo "   ejecuta localmente: ./fix-backend-startup.sh"
        echo "   El comando de inicio persiste en Azure entre despliegues."

        
